<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk Data to Me</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --accent: #818cf8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 12px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 24px; }
  .chips button { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 6px 12px; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .q { color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  .a { white-space: pre-wrap; }
  details { margin-top: 12px; font-size: .85rem; }
  summary { color: var(--accent); cursor: pointer; }
  pre { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .8rem; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Talk Data to Me</h1>
  <p class="sub">Ask about Stellar network fees, Oct 2025 – Sep 2026. Claude answers through a Malloy semantic layer and cannot write SQL.</p>
  <form id="f">
    <input id="q" maxlength="500" placeholder="What were network fees on Aug 15, 2026?" autocomplete="off" aria-label="Your question">
    <button id="go">Ask</button>
  </form>
  <div class="chips">
    <button type="button">What were network fees on Aug 15, 2026?</button>
    <button type="button">Which month had the highest fees?</button>
    <button type="button">Which operation types pay the most fees?</button>
    <button type="button">Average fee per transaction in September?</button>
  </div>
  <div id="out" aria-live="polite"></div>
  <footer>Public data from Hubble · <a href="https://github.com/stellar-experimental/Meridian-2026-Talk-Data-to-Me">source</a></footer>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), go = document.getElementById('go'), out = document.getElementById('out');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function ask(question) {
  go.disabled = true;
  const card = el('div', 'card');
  card.append(el('div', 'q', question));
  const a = el('div', 'a', 'Thinking…');
  card.append(a);
  out.prepend(card);
  try {
    const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }) });
    const data = await r.json();
    if (!r.ok) { a.textContent = data.detail || 'Something went wrong.'; return; }
    a.textContent = data.answer;
    for (const x of data.queries) {
      const d = el('details');
      d.append(el('summary', null, x.error ? 'Query (failed)' : 'Malloy query and generated SQL'));
      d.append(el('pre', null, x.malloy));
      d.append(el('pre', null, x.error || x.sql));
      card.append(d);
    }
  } catch { a.textContent = 'Network error. Try again.'; }
  finally { go.disabled = false; }
}

f.addEventListener('submit', e => { e.preventDefault(); const v = q.value.trim(); if (v) { ask(v); q.value = ''; } });
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
</script>
</body>
</html>
